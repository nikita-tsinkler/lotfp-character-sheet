<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LotFP Character Generator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+DW+Pica:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=Cormorant+SC:wght@500;600&family=EB+Garamond:ital@0;1&display=swap">
<style>
/* Layout: one narrow column, a funnel rail on top, one active step card below. Accent red is the single loud color. */
:root {
  --bg: #e6e3dc;
  --surface: #f1efe9;
  --fg: #171515;
  --muted: #6a645b;
  --line: #bdb7aa;
  --accent: #a3141f;
  --accent-fg: #f6f1e8;
  --good: #2c6b58;
  --die: #fbfaf6;
  --die-pip: #171515;
  --font-display: "IM Fell English SC", "Times New Roman", serif;
  --font-body: "IM Fell DW Pica", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #110f10; --surface: #1a1718; --fg: #e8e2d6; --muted: #9a9286; --line: #3a3436;
    --accent: #e0454f; --accent-fg: #130e0f; --good: #6cc2a3; --die: #e8e2d6; --die-pip: #131011;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #110f10; --surface: #1a1718; --fg: #e8e2d6; --muted: #9a9286; --line: #3a3436;
  --accent: #e0454f; --accent-fg: #130e0f; --good: #6cc2a3; --die: #e8e2d6; --die-pip: #131011;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 18px; line-height: 1.5;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .02em; }
p { margin: 0; max-width: 62ch; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header .kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
header h1 { font-size: clamp(30px, 8.4vw, 54px); line-height: 1.02; margin-top: 6px; white-space: nowrap; }
header h1 em { color: var(--accent); font-style: normal; }

/* funnel rail */
.rail { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 0; margin: 0; list-style: none; font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rail li { display: flex; align-items: center; gap: 8px; }
.rail li::before { content: ""; width: 9px; height: 9px; border: 1px solid var(--muted); border-radius: 50%; }
.rail li.on { color: var(--fg); }
.rail li.on::before { background: var(--accent); border-color: var(--accent); }
.rail li.done::before { background: var(--good); border-color: var(--good); }

.card { background: var(--surface); border: 1px solid var(--line); padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.card > header { display: flex; flex-direction: column; gap: 6px; }
.card h2 { font-size: 28px; }
.sub { color: var(--muted); }
#body, #body2, #body3, #body4, #body5, #bodyH { display: flex; flex-direction: column; gap: 20px; }
#body:empty, #body2:empty, #body3:empty, #body4:empty, #body5:empty, #bodyH:empty { display: none; }

/* method choice */
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.choice { text-align: left; background: transparent; border: 1px solid var(--line); padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.choice:hover { border-color: var(--fg); }
.choice[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.choice b { font-family: var(--font-display); font-weight: 400; font-size: 21px; }
.choice span { color: var(--muted); font-size: 16px; line-height: 1.35; }

.btn { background: var(--accent); color: var(--accent-fg); border: 0; padding: 11px 20px; cursor: pointer; font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.btn:hover { filter: brightness(1.1); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--fg); }
.btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ability rows */
.sheet { display: flex; flex-direction: column; border-top: 1px solid var(--fg); }
.row { display: grid; grid-template-columns: minmax(0, 1.5fr) auto 3.6ch 4.4ch; align-items: center; gap: 4px 16px; padding: 10px 6px; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; border-left: 0; border-right: 0; border-top: 0; }
.row .name { font-family: var(--font-display); font-size: 22px; line-height: 1.1; }
.row .name small { display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; color: var(--muted); }
.row .total { font-family: var(--font-mono); font-size: 22px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.row .mod { font-family: var(--font-mono); font-size: 22px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.mod.neg { color: var(--accent); } .mod.pos { color: var(--good); } .mod.zero { color: var(--muted); }
.row.pick { cursor: pointer; }
.row.pick:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
.row.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.row.swapped .nm::after { content: " ⇄"; color: var(--accent); }
.row .name small.desc { font-family: var(--font-body); font-size: 15px; letter-spacing: 0; color: var(--muted); line-height: 1.25; margin-top: 2px; }
.cols { display: flex; flex-wrap: wrap; gap: 20px 0; }
.cols > * { min-width: 0; }
.col-abil { flex: 1 1 280px; padding-right: 28px; }
.cols > :last-child { flex: 0 0 auto; border-left: 1px solid var(--line); padding-left: 28px; }
@media (max-width: 640px) { .col-abil { padding-right: 0; padding-bottom: 20px; } .cols > :last-child { flex: 1 1 100%; border-left: 0; border-top: 1px solid var(--line); padding: 20px 0 0; } }
.abil { margin: 0; display: grid; grid-template-columns: 1fr; gap: 0; font-size: 16px; }
.abil dd { margin-bottom: 8px; }
.abil dt { font-family: var(--font-display); font-size: 18px; }
.abil dd { margin: 0; color: var(--muted); }
.row.recap { grid-template-columns: minmax(0, 1fr) 3.6ch 4.4ch; }
.row-head { display: grid; grid-template-columns: minmax(0, 1.5fr) auto 3.6ch 4.4ch; gap: 16px; padding: 0 6px 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.row-head span:nth-child(n+3) { text-align: right; }

.dice { display: flex; gap: 6px; }
.die { width: 34px; height: 34px; background: var(--die); border-radius: 6px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 5px; border: 1px solid var(--line); }
.die i { width: 6px; height: 6px; border-radius: 50%; background: var(--die-pip); margin: auto; opacity: 0; }
.die i.on { opacity: 1; }
.die i.clr { opacity: 1; background: transparent; border: 1.5px solid color-mix(in srgb, var(--die-pip) 50%, transparent); }
.die.rolling { animation: tumble .45s ease-in-out; }
@keyframes tumble { 0% { transform: rotate(0) scale(.8); } 50% { transform: rotate(180deg) scale(1.08); } 100% { transform: rotate(360deg) scale(1); } }
@media (prefers-reduced-motion: reduce) { .die.rolling, .hdie.rolling { animation: none; } }

.tally { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 20px; font-family: var(--font-mono); font-size: 14px; padding-top: 4px; }
.tally b { font-size: 18px; }

.note { border-left: 3px solid var(--line); padding: 4px 0 4px 14px; }
.note.warn { border-color: var(--accent); }
.note.ok { border-color: var(--good); }
.note strong { font-weight: 400; font-family: var(--font-display); font-size: 20px; display: block; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; font-family: var(--font-mono); font-size: 15px; min-width: 260px; }
th, td { padding: 6px 22px 6px 0; text-align: left; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
tr.hit td { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.mt-title { font-size: 20px; margin-bottom: 6px; }

/* manual entry */
.entry { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.entry label { display: flex; flex-direction: column; gap: 4px; font-family: var(--font-display); font-size: 19px; }
.entry label small { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; color: var(--muted); }
.entry input { font-family: var(--font-mono); font-size: 20px; width: 100%; padding: 8px 10px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
.entry .m { font-family: var(--font-mono); font-size: 14px; min-height: 1.4em; }

.next { color: var(--muted); font-size: 16px; }
details summary { cursor: pointer; font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
details[open] summary { margin-bottom: 10px; }
.link { background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; color: var(--muted); }

.group { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.klass-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.klass { text-align: left; background: transparent; border: 1px solid var(--line); padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.klass:hover { border-color: var(--fg); }
.klass[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.klass h3 { font-size: 24px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { white-space: nowrap; font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); color: var(--muted); }
.k-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.tip { font-size: 15px; color: var(--muted); }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 10px 14px; border: 1px solid var(--line); background: var(--surface); }
.banner .chips { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--font-mono); font-size: 13px; }
.chip b { font-weight: 600; letter-spacing: .06em; }
.chip i { font-style: normal; font-weight: 600; }
.panel { display: flex; flex-direction: column; gap: 12px; }
.panel + .panel { padding-top: 6px; }
ul.plain, ol.plain { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 17px; }
.tiles, .slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile span { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tile em { font-style: normal; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.tile b { font-family: var(--font-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.result { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; }
.result .big { font-family: var(--font-mono); font-size: 40px; font-weight: 500; color: var(--accent); }
.inl { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; }
.inl input { width: 5ch; font-family: var(--font-mono); font-size: 18px; padding: 6px 8px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
.hp-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; }
.formula { font-family: var(--font-mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
.hp-dice { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.hdie { display: block; }
.hdie.rolling { animation: tumble .45s ease-in-out; }
.hp-roll { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.result { display: flex; align-items: baseline; gap: 10px; }
.points { font-size: 22px; font-family: var(--font-display); }
.points b { font-family: var(--font-mono); font-size: 30px; color: var(--accent); font-weight: 600; }
.skills-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 12px; }
@media (max-width: 640px) { .skills-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sk { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sk-name { font-family: var(--font-display); font-size: 18px; line-height: 1.1; display: flex; align-items: flex-end; }
.sk-note { font-family: var(--font-mono); font-size: 11px; color: var(--muted); line-height: 1.2; min-width: 0; }
.sk-die { display: flex; align-items: center; gap: 8px; }
.die.lg { width: 40px; height: 40px; padding: 6px; }
.die.lg i { width: 8px; height: 8px; }
.sk-stp { display: flex; flex-direction: column; gap: 4px; }
.sk-stp button { width: 28px; height: 22px; background: transparent; border: 1px solid var(--line); cursor: pointer; font-family: var(--font-mono); font-size: 14px; line-height: 1; padding: 0; }
.sk-stp button:hover:not(:disabled) { background: color-mix(in srgb, var(--fg) 8%, transparent); }
.sk-stp button:disabled { opacity: .3; cursor: not-allowed; }
.stable { display: flex; flex-direction: column; border-top: 1px solid var(--fg); }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 4px 14px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.srow .sn { font-family: var(--font-display); font-size: 19px; min-width: 0; }
.srow .sv { font-family: var(--font-mono); font-size: 14px; text-align: right; max-width: 13ch; line-height: 1.25; font-variant-numeric: tabular-nums; }
.stp { display: inline-flex; align-items: center; border: 1px solid var(--line); }
.stp.na { border: 0; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.stp button { width: 32px; height: 32px; background: transparent; border: 0; cursor: pointer; font-family: var(--font-mono); font-size: 16px; }
.stp button:hover:not(:disabled) { background: color-mix(in srgb, var(--fg) 8%, transparent); }
.stp button:disabled { opacity: .3; cursor: not-allowed; }
.stp i { font-style: normal; font-family: var(--font-mono); min-width: 2ch; text-align: center; }
.cname { width: 100%; font-family: var(--font-display); font-size: 19px; background: transparent; color: var(--fg); border: 0; border-bottom: 1px dashed var(--line); padding: 2px 0; }
.fs { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.fs label { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--muted); }
.fs select { font: inherit; font-size: 15px; padding: 3px 6px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
.book { display: flex; flex-direction: column; border-top: 1px solid var(--fg); }
.brow { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 6px 12px; padding: 8px 2px; border-bottom: 1px solid var(--line); align-items: start; }
.bl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 4px; }
.todo { font-size: 16px; padding: 2px 0; color: var(--muted); }
.chips2 { display: flex; flex-wrap: wrap; gap: 6px; }
.sp { border: 1px solid var(--line); padding: 3px 10px; font-size: 16px; display: inline-flex; gap: 8px; align-items: baseline; }
.sp i { font-style: normal; font-family: var(--font-mono); font-size: 11px; color: var(--accent); }
.klass:disabled { opacity: .45; cursor: not-allowed; }
.klass:disabled:hover { border-color: var(--line); }
.tag.req { font-size: 11px; padding: 2px 6px; align-self: flex-start; border-color: var(--accent); color: var(--accent); margin-top: auto; }
.klass.align p { font-size: 16px; line-height: 1.35; color: var(--fg); }
.group-inline { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.align-grid { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.lvl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.stepper { display: inline-flex; border: 1px solid var(--fg); }
.stepper button { width: 44px; height: 44px; background: transparent; border: 0; font-family: var(--font-mono); font-size: 20px; cursor: pointer; }
.stepper button:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
.stepper input { width: 4.2ch; height: 44px; text-align: center; font-family: var(--font-mono); font-size: 20px; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--bg); color: var(--fg); -moz-appearance: textfield; appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.banner-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.banner-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; }
.chip-class { font-family: var(--font-mono); font-size: 13px; }
.btn.sm { padding: 6px 12px; font-size: 11px; }
.klass ul { margin: 0; padding-left: 18px; font-size: 16px; line-height: 1.35; display: flex; flex-direction: column; gap: 4px; }
.klass-wrap { display: flex; flex-direction: column; gap: 12px; }
.chosen { font-family: var(--font-display); font-size: 24px; }
@media (max-width: 480px) {
  .card { padding: 16px; }
  .row { grid-template-columns: minmax(0, 1fr) 3.6ch 4.4ch; }
  .row .dice { grid-column: 1 / -1; grid-row: 2; }
  .row-head { grid-template-columns: minmax(0, 1fr) 3.6ch 4.4ch; }
  .row-head span:nth-child(2) { display: none; }
  .row-head span:nth-child(n+3) { text-align: right; }
}

/* character sheet */
.book .brow { display: flex; gap: 12px; align-items: baseline; padding: 4px 0; } .book .bl { min-width: 70px; color: var(--muted); }
.chips2 { display: flex; flex-wrap: wrap; gap: 6px; }

.chars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.char { display: flex; gap: 10px; align-items: stretch; }
.char-open { flex: 1; text-align: left; background: transparent; color: var(--fg); border: 1px solid var(--line); padding: 12px 14px; cursor: pointer; font-family: var(--font-body); font-size: 17px; display: flex; flex-direction: column; gap: 2px; }
.char-open:hover { border-color: var(--fg); }
.char-open span { color: var(--muted); font-size: 14px; }
.io { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 6px; }
.io textarea { width: 100%; box-sizing: border-box; background: var(--surface); color: var(--fg); border: 1px solid var(--line); font: 12px var(--font-mono); padding: 8px; }
label.file { cursor: pointer; display: inline-block; }
.tip.warn { color: var(--accent); }

.namein { width: 100%; box-sizing: border-box; background: transparent; color: var(--fg); border: 0; border-bottom: 1px solid var(--line); font-family: var(--font-display); font-size: 30px; padding: 4px 0; }
.namein:focus-visible, .sm-in:focus-visible, .notes:focus-visible, .hpval input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.idgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 12px; }
.fld { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fl { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.fld b { font-family: var(--font-display); font-size: 20px; font-weight: 400; }
.fld small { color: var(--muted); font-size: 13px; }
.sm-in { width: 100%; box-sizing: border-box; background: transparent; color: var(--fg); border: 0; border-bottom: 1px solid var(--line); font: 18px var(--font-body); padding: 2px 0; }

  /* ---------- step 3: level and alignment ---------- */

  /* ---------- step 4: character details ---------- */

  function lvRow(k, L) { var t = GAME.classes[k].levels; return t[Math.max(1, Math.min(L, t.length)) - 1]; }
  var SAVE_NAMES = GAME.saves.map(function (s) { return s.en; });

  /* hit points */

  }

  /* saving throws, attack bonus, combat options */

      var key = i === 4 ? "INT" : "WIS", m = effMod(key);

      "</section>" +
      '<section class="panel"><div class="group">Attack bonuses and combat options</div>' +
      '<div class="tiles"><div class="tile"><span>Base AB</span><b>' + fmt(base) + "</b></div>" +

  /* skills */
  function skillValue(n) {

  function ptsUsed() { var t = 0; Object.keys(state.pts).forEach(function (k) { t += state.pts[k]; }); state.custom.forEach(function (c) { t += c.pts; }); return t; }
  function pool() { return lvRow("Specialist", state.level).skillPoints; }
  function stepper(attr, key, p, canAdd) {
    return '<span class="stp"><button type="button" ' + attr + '="' + esc(key) + '" data-d="-1" aria-label="Remove a point"' + (p <= 0 ? " disabled" : "") + '>−</button><i>' + p + '</i><button type="button" ' + attr + '="' + esc(key) + '" data-d="1" aria-label="Add a point"' + (canAdd ? "" : " disabled") + ">+</button></span>";
  }

  }
  function skStep(attr, key, p, canAdd) {

  }

  /* spells */

  /* ---------- step 5: character sheet ---------- */

  function hpStatus(v) {
    if (isNaN(v)) return "";
    return v <= -4 ? "Dead" : v === -3 ? "Mortally wounded" : v <= 0 ? "Unable to act" : "";
  }
  function setHpStatus(raw) { var e = el("hpstat"); if (e) e.textContent = hpStatus(parseInt(raw, 10)); }
  function xpPct(xp) {
    var a = xpFor(state.klass, state.level), b = xpFor(state.klass, state.level + 1), v = parseInt(String(xp).replace(/[^\d]/g, ""), 10);
    if (isNaN(v)) v = a;
    return Math.max(0, Math.min(100, (v - a) / (b - a) * 100));
  }

  function sheetHTML() {
    var k = state.klass, L = state.level, auto = state.method === "auto" && state.rolls, S = state.sheet;
    var sc = auto ? autoScores() : null, h = "";
    var f = FIGHTERISH[k], sv = savesFor(), base = lvRow(k, L).ab;
    var sm = effMod("STR"), dm = effMod("DEX");
    S.used = S.used || {};

    /* identity */
    var xp = S.xp === undefined || S.xp === null || S.xp === "" ? xpFor(k, L) : S.xp, xpn = parseInt(String(xp).replace(/[^\d]/g, ""), 10);
    if (!isNaN(xpn)) xp = num(xpn);
    h += '<div class="ident"><span class="idline">Level ' + L + " " + esc(k) + " · " + esc(state.align) + "</span>" +
      '<div class="xp"><div class="xpbar" aria-hidden="true"><i id="xpfill" style="width:' + xpPct(xp) + '%"></i></div>' +
      '<label class="xpnum"><input data-f="xp" id="xpin" type="text" inputmode="numeric" maxlength="9" aria-label="Current experience points" value="' + esc(xp) + '"><span>/ ' + num(xpFor(k, L + 1)) + " XP</span></label></div></div>";

    /* at a glance */
    var max = state.hp ? state.hp.total : "", cur = S.curhp === null ? max : S.curhp;
    var maxHTML = state.hp ? "<b>" + max + "</b>" : '<input class="sm-in" data-f="maxhp" type="text" inputmode="numeric" maxlength="3" aria-label="Maximum hit points" value="' + esc(S.maxhp || "") + '">';
    h += '<section class="glance">' +
      '<div class="g-hp"><button class="hpb" type="button" data-hp="-1" aria-label="Lose 1 hit point">−</button>' +
      '<div class="hpmid"><div class="hpval"><input id="curhp" data-f="curhp" type="text" inputmode="numeric" aria-label="Current hit points" value="' + esc(cur) + '"><span class="of">/ ' + maxHTML + "</span></div>" +
      '<span class="fl">Hit points</span><span class="hpstat" id="hpstat" role="status">' + hpStatus(parseInt(cur, 10)) + "</span></div>" +
      '<button class="hpb" type="button" data-hp="1" aria-label="Gain 1 hit point">+</button></div>' +
      '<div class="g-stat"><span class="fl">AC</span><b>' + (dm === null ? "12<small> + DEX</small>" : 12 + dm) + "</b></div>" +
      '<div class="g-stat"><span class="fl">Melee AB</span><b>' + (sm === null ? fmt(base) + "<small> + STR</small>" : fmt(base + sm)) + "</b></div>" +
      '<div class="g-stat"><span class="fl">Ranged AB</span><b>' + (dm === null ? fmt(base) + "<small> + DEX</small>" : fmt(base + dm)) + "</b></div>" +
      '<div class="g-stat g-sur"><span class="fl">Surprise</span>' + dieBox(k === "Elf" ? 1 : 2) + '<small class="g-sub">AC 10</small></div></section>';
    h += '<div class="opts"><span class="fl">Combat options</span><span class="opt">Parry <b>+' + (f ? 4 : 2) + " AC</b></span>" +
      (f ? '<span class="opt">Press <b>+2 hit, −4 AC</b></span><span class="opt">Defensive <b>+2 AC, −4 hit</b></span>' : "") + "</div>";

    /* abilities + saves */
    h += '<div class="twocol"><section class="panel"><div class="group">Ability scores</div><div class="sheet flat">' + ABILITIES.map(function (a, i) {
      var m = effMod(a.key), bn = racialBonus(a.key);
      return '<div class="row arow"><span class="name"><span class="nm">' + a.name + '</span><small class="desc">' + ABIL_SHORT[a.key] + (bn ? " · " + k + " +1" : "") + '</small></span><span class="score">' + (auto ? sc[i] : "") + '</span><span class="mod ' + (m === null ? "zero" : cls(m)) + '">' + (m === null ? "—" : fmt(m)) + "</span></div>";
    }).join("") + "</div></section>" +
      '<section class="panel"><div class="group">Saving throws</div><div class="sheet flat">' + SAVE_NAMES.map(function (n, i) {
        var key = i === 4 ? "INT" : "WIS", m = effMod(key);
        return '<div class="row arow srow"><span class="name"><span class="nm">' + n + '</span><small class="desc">' + SAVE_HINT[i] + (m === null ? " · + " + key + " mod" : "") + '</small></span><span class="mod">' + (m === null ? sv[i] : sv[i] - m) + "</span></div>";
      }).join("") + '</div><p class="colhint">Roll a d20. Equal or higher saves.</p></section></div>';

    /* skills */
    var order = SKILL_ORDER;
    var tiles = order.map(function (n) {
      var cap = "", r = n === "Sneak Attack" ? Math.min(6, skillBase(n) + (state.pts[n] || 0)) : skillRating(n);
      if (n === "Languages" && effMod("INT") === null) cap = "+ INT mod";
      if (n === "Open Doors" && effMod("STR") === null) cap = "+ STR mod";
      if (n === "Sneak Attack" && r > 1) cap = "×" + r + " damage";
      var t = skillTile(n, r, 0, "", cap, n);
      return t;
    });
    if (k === "Specialist") state.custom.forEach(function (c) { if (c.name || c.pts) tiles.push(skillTile("c", 1 + c.pts, 5, "", "", esc(c.name || "Custom skill"))); });
    h += '<section class="panel"><div class="group">Skills</div><div class="skills-grid">' + tiles.join("") + "</div></section>";

    /* spells: slots and known spells per level */
    var slots = slotsFor();
    if (slots) {
      var book = k !== "Cleric";
      h += '<section class="panel"><div class="group">Spells</div><div class="spl">' + slots.map(function (n, i) {
        var lv = i + 1, dots = "", known = [];
        for (var d = 0; d < n; d++) { var key = lv + "-" + d, u = S.used[key]; dots += '<button type="button" class="slot' + (u ? " used" : "") + '" data-slot="' + key + '" aria-pressed="' + !!u + '" aria-label="' + ordinal(lv) + " level slot " + (d + 1) + '"></button>'; }
        if (book) { if (lv === 1) known.push("Read Magic"); if (state.spells && state.spells[lv]) known = known.concat(state.spells[lv]); }
        return '<div class="splrow"><span class="bl">' + ordinal(lv) + '</span><div class="dots">' + dots + "</div>" +
          (book ? '<div class="chips2">' + (known.length ? known.map(function (s) { return '<span class="sp">' + esc(s) + "</span>"; }).join("") : '<span class="sub none">No spells known</span>') + "</div>" : "") + "</div>";
      }).join("") + "</div>" + (book ? "" : '<p class="colhint">Prepare any Cleric spell of a level you have slots for.</p>') + "</section>";
    }

    h += '<section class="panel"><div class="group">Notes</div><textarea class="notes" data-f="notes" rows="4" aria-label="Notes" placeholder="Anything worth remembering">' + esc(S.notes || "") + "</textarea></section>";
    return h;
  }

  function renderSheet() {
    ensureDetails();
    var auto = state.method === "auto" && state.rolls, notes = ["Saved automatically on this device."];
    if (!auto) notes.push("Ability scores were rolled at the table, so values that depend on them show the modifier to add.");
    notes.push("Armor class assumes no armor until equipment is added.");
    el("body5").innerHTML =
      '<div class="sheethead"><button class="link" id="back-home" type="button">&larr; Characters</button><button class="link" id="back-det" type="button">Edit</button></div>' +
      '<input class="namein" data-f="name" type="text" maxlength="40" placeholder="Character name" aria-label="Character name" value="' + esc(state.sheet.name) + '">' +
      sheetHTML();
    el("sheettip").textContent = notes.join(" ");
    persist();
    el("back-home").addEventListener("click", goHome);
    el("back-det").addEventListener("click", function () { state.detailsDone = false; state.view = "s4"; layout(true); });
    var b = el("body5");
    b.querySelectorAll("[data-f]").forEach(function (i) {
      i.addEventListener("input", function () {
        state.sheet[i.dataset.f] = i.value;
        if (i.id === "curhp") setHpStatus(i.value);
        if (i.id === "xpin") el("xpfill").style.width = xpPct(i.value) + "%";
        persist();
      });
    });
    b.querySelectorAll("[data-hp]").forEach(function (x) {
      x.addEventListener("click", function () {
        var c = el("curhp"), v = parseInt(c.value, 10);
        if (isNaN(v)) v = state.hp ? state.hp.total : 0;
        c.value = v + (+x.dataset.hp); state.sheet.curhp = c.value; setHpStatus(c.value); persist();
      });
    });
    b.querySelectorAll("[data-slot]").forEach(function (x) {
      x.addEventListener("click", function () {
        var key = x.dataset.slot, u = !state.sheet.used[key];
        if (u) state.sheet.used[key] = true; else delete state.sheet.used[key];
        x.classList.toggle("used", u); x.setAttribute("aria-pressed", u); persist();
      });
    });
  }

  Object.keys(GAME.alignments).forEach(function (a) { RU[a] = GAME.alignments[a]; });
  GAME.saves.concat(GAME.skills).forEach(function (t) { RU[t.en] = t.ru; });
  GAME.spellLists.magicUser.concat(GAME.spellLists.cleric).forEach(function (l) { l.forEach(function (sp) { if (sp.ru) RU[sp.en] = sp.ru; }); });

  /* token pass for short stat strings like "+2 hit, −4 AC" or "1d6 + 2 × CON mod" */
  var RU_TOKENS = [
    [/\b(CHA|CON|DEX|INT|STR|WIS) mod\b/g, function (m, k) { return "мод. " + RU[k]; }],
    [/\b(CHA|CON|DEX|INT|STR|WIS)\b/g, function (m, k) { return RU[k]; }],
    [/\bin 6\b/g, "из 6"], [/\bAC\b/g, "КБ"], [/\bHP\b/g, "ПЗ"], [/\bXP\b/g, "опыта"], [/\bhit\b/g, "к удару"], [/\bdamage\b/g, "урона"], [/\bmod\b/g, "мод."]
  ];
  var RU_RULES = [
    [/^Level (\d+) (Cleric|Fighter|Magic-User|Specialist|Dwarf|Elf|Halfling)$/, function (m, l, k) { return RU[k] + " " + l + "-го уровня"; }],
    [/^(Cleric|Fighter|Magic-User|Specialist|Dwarf|Elf|Halfling) \+1$/, function (m, k) { return RU[k] + " +1"; }],
    [/^Required for (.+)$/, function (m, k) { return "Обязательно для " + (RU_GEN[k] || RU[k] || k); }],
    [/^(1st|2nd|3rd|[4-9]th)$/, function (m, o) { return RU_ORD[o]; }],
    [/^(1st|2nd|3rd|[4-9]th) level$/, function (m, o) { return RU_ORD[o] + " уровень"; }],
    [/^(1st|2nd|3rd|[4-9]th) level slot (\d+)$/, function (m, o, n) { return "Ячейка " + RU_ORD[o].replace("-й", "-го") + " уровня, " + n; }],
    [/^(\d+) of 6$/, "$1 из 6"],
    [/^of (\d+) skill points left$/, "из $1 очков навыков осталось"],
    [/^Total modifier (.+)$/, "Сумма модификаторов $1"],
    [/^Swap (\w+) with (\w+)\? You can only do this once\.$/, function (m, a, b) { return "Поменять " + RU_ACC[a] + " и " + RU_ACC[b] + "? Это можно сделать только один раз."; }],
    [/^Minimum (\d+) hit points at level 1\.$/, "Минимум $1 ПЗ на 1 уровне."],
    [/^Raised to the level 1 minimum of (\d+)\.$/, "Поднято до минимума 1 уровня: $1."],
    [/^HP (d\d+)$/, "ПЗ $1"],
    [/^HP (d\d+), then (d\d+)$/, "ПЗ $1, затем $2"],
    [/^Take no other action this round for \+(\d) AC\.$/, "Никаких других действий в этом раунде: +$1 к КБ."],
    [/^Custom skill (\d) name$/, "Название своего навыка $1"],
    [/^Added (\d+)\.$/, "Добавлено: $1."],
    [/^Hit points: rolled at the table$/, "Пункты здоровья: брошены за столом"],
    [/^(Hit points|Spellbook): ?$/, function (m, k) { return RU[k] + ": "; }]
  ];

  var LANG = "en";
  try { LANG = localStorage.getItem("lotfp.lang") === "ru" ? "ru" : "en"; } catch (e) {}
  function trOne(s) {
    if (RU.hasOwnProperty(s)) return RU[s];
    for (var i = 0; i < RU_RULES.length; i++) if (RU_RULES[i][0].test(s)) return s.replace(RU_RULES[i][0], RU_RULES[i][1]);
    return null;
  }
  function tr(s) {
    var r = trOne(s);
    if (r !== null) return r;
    if (s.indexOf(" · ") > -1) return s.split(" · ").map(tr).join(" · ");
    var lead = s.match(/^[.,:;]\s*/);
    if (lead) { r = tr(s.slice(lead[0].length)); return r === s.slice(lead[0].length) ? s : lead[0] + r; }
    var parts = s.replace(/([.?!])\s+(?=[A-Z])/g, "$1\u0000").split("\u0000");
    if (parts.length > 1) { var ok = true, out = parts.map(function (p) { var q = trOne(p); if (q === null) ok = false; return q; }); if (ok) return out.join(" "); }
    var t = s;
    RU_TOKENS.forEach(function (x) { t = t.replace(x[0], x[1]); });
    if (!/[A-Za-z]/.test(t.replace(/\b\d*d\d+\b/g, ""))) return t;
    if (window.__i18nMissing) window.__i18nMissing.add(s);
    return s;
  }
  function skipNode(n) {
    for (var p = n.parentNode; p && p !== document.body; p = p.parentNode) {
      if (p.nodeType === 1 && (p.tagName === "SCRIPT" || p.tagName === "STYLE" || p.tagName === "TEXTAREA" || p.hasAttribute("data-notr"))) return true;
    }
    return false;
  }
  var ATTRS = ["placeholder", "aria-label", "title"];
  function translateTree(root) {
    if (LANG !== "ru" || !root) return;
    if (root.nodeType === 3) { trText(root); return; }
    if (root.nodeType !== 1) return;
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), n, list = [];
    while ((n = w.nextNode())) list.push(n);
    list.forEach(trText);
    var els = [root].concat([].slice.call(root.querySelectorAll("[placeholder],[aria-label],[title]")));
    els.forEach(function (e) {
      if (!e.getAttribute) return;
      ATTRS.forEach(function (a) {
        var v = e.getAttribute(a);
        if (!v || !/[A-Za-z]/.test(v)) return;
        e.__en = e.__en || {};
        if (!(a in e.__en)) e.__en[a] = v;
        var r = tr(v);
        if (r !== v) e.setAttribute(a, r);
      });
    });
  }
  function trText(n) {
    var d = n.data;
    if (!/[A-Za-z]/.test(d) || skipNode(n)) return;
    var m = d.match(/^(\s*)([\s\S]*?)(\s*)$/), core = m[2].replace(/\s+/g, " ");
    var r = tr(core);
    if (r !== core) { if (n.__en === undefined) n.__en = d; n.data = m[1] + r + m[3]; }
  }
  function restoreEnglish() {
    var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT), n;
    while ((n = w.nextNode())) if (n.__en !== undefined) { n.data = n.__en; n.__en = undefined; }
    document.querySelectorAll("[placeholder],[aria-label],[title]").forEach(function (e) {
      if (e.__en) { Object.keys(e.__en).forEach(function (a) { e.setAttribute(a, e.__en[a]); }); e.__en = null; }
    });
  }
  var observer = new MutationObserver(function (muts) {
    if (LANG !== "ru") return;
    muts.forEach(function (m) { m.addedNodes.forEach(function (x) { translateTree(x); }); });
  });
  observer.observe(document.body, { childList: true, subtree: true });
  function renderLangToggle() {
    document.querySelectorAll("[data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.lang === LANG); });
  }
  function setLang(l) {
    if (l === LANG) return;
    LANG = l;
    try { localStorage.setItem("lotfp.lang", l); } catch (e) {}
    document.documentElement.lang = l;
    if (l === "en") restoreEnglish();
    render();
    if (l === "ru") translateTree(document.body);
    renderLangToggle();
  }
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-lang]").forEach(function (b) { b.addEventListener("click", function () { setLang(b.dataset.lang); }); });
  renderLangToggle();

  /* ---------- storage ---------- */
  var KEY = "lotfp.characters.v1", mem = null, storageOk = true;
  function loadAll() {
    if (mem) return mem;
    try { var r = localStorage.getItem(KEY); mem = r ? JSON.parse(r) : []; } catch (e) { storageOk = false; mem = []; }
    if (!Array.isArray(mem)) mem = [];
    return mem;
  }
  function saveAll(list) {
    mem = list;
    try { localStorage.setItem(KEY, JSON.stringify(list)); storageOk = true; } catch (e) { storageOk = false; }
  }
  function persist() {
    if (!state.id) state.id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var list = loadAll().slice(), snap = { id: state.id, savedAt: Date.now(), state: JSON.parse(JSON.stringify(state)) };
    var i = list.findIndex(function (x) { return x.id === state.id; });
    if (i < 0) list.unshift(snap); else list[i] = snap;
    saveAll(list);
  }
  function charTitle(c) { var t = c.state; return (t.sheet && t.sheet.name) || ("Level " + t.level + " " + t.klass); }
  function openChar(c) {
    state = Object.assign(freshState(), JSON.parse(JSON.stringify(c.state)));
    if (state.pts && state.pts.Tinkering !== undefined) { state.pts.Tinker = state.pts.Tinkering; delete state.pts.Tinkering; }
    state.id = c.id; state.view = "s5"; syncChar(); layout(true);
  }
  function goHome() { state = freshState(); state.view = "home"; layout(true); }
  function importText(txt) {
    var data = JSON.parse(txt), arr = Array.isArray(data) ? data : [data], n = 0, list = loadAll().slice();
    arr.forEach(function (c) {
      if (!c || !c.id || !c.state || !c.state.klass || !c.state.level) return;
      var i = list.findIndex(function (x) { return x.id === c.id; });
      if (i < 0) list.push(c); else list[i] = c;
      n++;
    });
    if (!n) throw new Error("no characters");
    saveAll(list); return n;
  }

  function renderHome() {
    var list = loadAll(), b = el("bodyH");
    var items = list.map(function (c) {
      var t = c.state;
      return '<li class="char"><button class="char-open" type="button" data-open="' + esc(c.id) + '"><b' + (t.sheet && t.sheet.name ? " data-notr" : "") + '>' + esc(charTitle(c)) + "</b><span>" + esc(t.klass) + " \u00b7 " + esc(t.align || "") + (t.hp ? " \u00b7 " + t.hp.total + " HP" : "") + '</span></button><button class="btn ghost sm" type="button" data-exp="' + esc(c.id) + '">Export</button><button class="btn ghost sm" type="button" data-del="' + esc(c.id) + '">Delete</button></li>';
    }).join("");
    b.innerHTML = '<div class="actions"><button class="btn" id="h-new" type="button">New character</button></div>' +
      (list.length ? '<ul class="chars">' + items + "</ul>" : '<p class="sub">No saved characters yet. Create your first one.</p>') +
      '<div class="actions"><button class="btn ghost sm" id="h-bak" type="button">Backup</button><button class="btn ghost sm" id="h-imp" type="button">Import</button></div>' +
      '<div id="h-io"></div>';
    var ht = el("hometip");
    ht.className = "tip outside" + (storageOk ? "" : " warn");
    ht.textContent = storageOk ? "Characters are saved automatically in this browser on this device. Use Backup to keep a copy elsewhere." : "This browser is blocking saving, so characters will be lost when you close the page. Use Backup to keep a copy.";
    el("h-new").addEventListener("click", function () { state = freshState(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
    el("h-bak").addEventListener("click", function () { ioPanel("Copy this text and keep it somewhere safe.", JSON.stringify(loadAll()), false); });
    el("h-imp").addEventListener("click", function () { ioPanel("Paste backup text here, or choose a file.", "", true); });
    b.querySelectorAll("[data-open]").forEach(function (x) { x.addEventListener("click", function () { var c = loadAll().find(function (q) { return q.id === x.dataset.open; }); if (c) openChar(c); }); });
    b.querySelectorAll("[data-exp]").forEach(function (x) { x.addEventListener("click", function () { var c = loadAll().find(function (q) { return q.id === x.dataset.exp; }); if (c) ioPanel("Copy this text to keep or move this character. Use Import to add it back.", JSON.stringify([c]), false); }); });
    b.querySelectorAll("[data-del]").forEach(function (x) {
      x.addEventListener("click", function () {
        if (x.dataset.arm !== "1") { x.dataset.arm = "1"; x.textContent = "Sure?"; setTimeout(function () { x.dataset.arm = ""; x.textContent = "Delete"; }, 3000); return; }
        saveAll(loadAll().filter(function (q) { return q.id !== x.dataset.del; })); renderHome();
      });
    });
  }
  function ioPanel(msg, text, imp, host) {
    var h = el(host || "h-io");
    h.innerHTML = '<div class="io"><p class="sub">' + msg + '</p><textarea id="io-t" rows="5" spellcheck="false" aria-label="Backup text">' + esc(text) + "</textarea>" +
      '<div class="actions">' + (imp ? '<button class="btn" id="io-go" type="button">Add characters</button><label class="btn ghost file">Choose file<input id="io-f" type="file" accept=".json,.txt,application/json,text/plain" hidden></label>' : '<button class="btn" id="io-copy" type="button">Copy</button>') +
      '<button class="btn ghost" id="io-x" type="button">Close</button><span class="sub" id="io-m"></span></div></div>';
    var t = el("io-t"), m = el("io-m");
    el("io-x").addEventListener("click", function () { h.innerHTML = ""; });
    if (imp) {
      var go = function () { try { var n = importText(t.value); if (!host) renderHome(); else m.textContent = "Added " + n + "."; } catch (e) { m.textContent = "That doesn't look like a character backup."; } };
      el("io-go").addEventListener("click", go);
      el("io-f").addEventListener("change", function (ev) { var f = ev.target.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { t.value = r.result; go(); }; r.readAsText(f); });
    } else {
      t.addEventListener("focus", function () { t.select(); });
      el("io-copy").addEventListener("click", function () { t.select(); try { navigator.clipboard.writeText(t.value).then(function () { m.textContent = "Copied."; }, function () { m.textContent = "Press Ctrl/Cmd+C to copy."; }); } catch (e) { m.textContent = "Press Ctrl/Cmd+C to copy."; } });
    }
  }

  /* which card is visible */
  function layout(scroll) {
    var v = state.view;
    el("home").hidden = v !== "home"; el("hometip").hidden = v !== "home"; el("sheettip").hidden = v !== "s5";
    el("rail").hidden = v === "home" || v === "s5";
    el("title").hidden = v === "s5"; el("kicker").hidden = v === "s5";
    el("title").textContent = v === "home" ? "Your adventurers" : "Create your adventurer";
    el("restart").hidden = v === "home" || v === "s5";
    el("step1").hidden = !(v === "s1" || v === "recap");
    el("step2").hidden = v !== "s2";
    el("step3").hidden = v !== "s3";
    el("step4").hidden = v !== "s4";
    el("step5").hidden = v !== "s5";
    el("banner").hidden = !(v === "s2" || v === "s3" || v === "s4");
    if (v === "recap") renderRecap();
    if (v === "s2") { renderBanner(); renderClass(); }
    if (v === "s3") { renderBanner(); renderLevelAlign(); }
    if (v === "s4") { renderBanner(); renderDetails(); }
    if (v === "s5") renderSheet();
    if (v === "home") renderHome();
    renderRail();
    if (scroll) window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function render() {
    el("pick-manual").setAttribute("aria-pressed", state.method === "manual");
    el("pick-auto").setAttribute("aria-pressed", state.method === "auto");
    layout(false);
    if (state.view === "s1") {
      if (state.method === "manual") renderManual();
      else if (state.method === "auto") renderAuto();
      else el("body").innerHTML = "";
    }
  }

  var restartTimer = null;
  el("restart").addEventListener("click", function () {
    var b = el("restart");
    if (state.method && !restartTimer) {
      b.textContent = "Leave? Progress is lost";
      restartTimer = setTimeout(function () { restartTimer = null; b.innerHTML = "&larr; Characters"; }, 3000);
      return;
    }
    clearTimeout(restartTimer); restartTimer = null; b.innerHTML = "&larr; Characters";
    window.lotfpCharacter = undefined; goHome();
  });
  el("pick-manual").addEventListener("click", function () { state.method = "manual"; state.confirmed = false; state.view = "s1"; render(); });
  el("pick-auto").addEventListener("click", function () { state.method = "auto"; state.confirmed = false; state.view = "s1"; render(); });
  state.view = "home";
  render();
  translateTree(document.body);
})();
</script>

</body></html>
